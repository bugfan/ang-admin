#
# FreeRADIUS clients.conf - 测试环境配置
# 注意：FreeRADIUS 3.2+ 默认要求 Message-Authenticator 属性（安全加固）
# 测试环境中通过 require_message_authenticator = no 关闭此要求
#
# Mac Docker Desktop 宿主机源 IP 为 192.168.65.1，需允许所有来源
#

client all {
    ipaddr                        = 0.0.0.0/0
    secret                        = testing123
    shortname                     = all
    nas_type                      = other
    # 关闭 Message-Authenticator 强制要求（兼容 layeh.com/radius 等标准 PAP 客户端）
    require_message_authenticator = no
}
